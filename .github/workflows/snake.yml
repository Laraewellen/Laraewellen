
name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Laraewellen
          outputs: |
            dist/snake-berry.svg?color_snake=%23E05291&color_dots=%23EDE8F1,%23CBB6DD,%23A382C1,%2380559F,%23593675
            dist/snake-berry-dark.svg?color_snake=%23FF83B3&color_dots=%23252030,%2359446E,%2380649D,%23AD8CC9,%23D7B9EF

            dist/snake-cosmic.svg?color_snake=%23C154E8&color_dots=%23EAE6F0,%23C5B5DC,%239881BE,%236F509C,%23442B70
            dist/snake-cosmic-dark.svg?color_snake=%23E49AFF&color_dots=%23252030,%234B3966,%237657A0,%23A37CCC,%23D4B1F2

            dist/snake-plum.svg?color_snake=%23D85B86&color_dots=%23F0E7ED,%23D9B9D0,%23BA8CAD,%23925C8E,%23653C70
            dist/snake-plum-dark.svg?color_snake=%23FFA1C3&color_dots=%2328212E,%2360445E,%2391648B,%23C18BB4,%23E8B5D6

      - name: Publish snake SVGs to output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
